# RWRUMI development environment: ROS 2 Humble from RoboStack.
#
# Create:  mamba env create -f environment.yml        (or: micromamba create -f environment.yml)
# Update:  mamba env update -f environment.yml --prune (run after every git pull that changes this file)
# Use:     mamba activate rwrumi
#
# Add new dependencies HERE (not with a bare `mamba install` / `pip install`),
# so every collaborator gets them on the next update.
name: rwrumi
channels:
  - robostack-humble
  - conda-forge
dependencies:
  # ROS 2
  - ros-humble-desktop=0.10
  # robot model / visualization
  - ros-humble-xacro
  - ros-humble-joint-state-publisher
  - ros-humble-joint-state-publisher-gui
  # build tools
  - colcon-common-extensions=0.3
  - setuptools<=58.2.0        # newer setuptools breaks/warns on colcon ament_python builds
  - compilers=2
  - cmake=4
  - pkg-config=0.29
  - make=4
  - ninja=1
